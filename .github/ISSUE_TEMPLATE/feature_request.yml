name: Feature request
description: Propose a capability with measurable value and acceptance criteria.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who needs this and what is currently impossible or inefficient?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful solution and affected modules.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Give observable, testable outcomes.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security, privacy, and operational risks
      description: Include permissions, costs, failure behavior, and rollback considerations.

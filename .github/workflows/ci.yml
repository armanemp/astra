name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Resolve and install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}
      - name: Check formatting and lint
        run: uv run --python ${{ matrix.python-version }} ruff check .
      - name: Check types
        run: uv run --python ${{ matrix.python-version }} mypy src/astra
      - name: Run tests with coverage
        run: uv run --python ${{ matrix.python-version }} pytest --cov=astra --cov-report=term-missing --cov-fail-under=90
      - name: Upload initial lockfile for bootstrap review
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: astra-uv-lock-bootstrap
          path: uv.lock
          if-no-files-found: error
          retention-days: 1

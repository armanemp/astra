[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-ai"
version = "0.1.0"
description = "A safety-conscious, self-improving AI assistant platform."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "mypy>=2.4.0,<3.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=6,<8.0",
  "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["astra"]

[tool.coverage.report]
show_missing = true
fail_under = 90
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S"]
"src/astra/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["astra"]
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["fastapi.*", "pydantic_settings.*", "alembic.*"]
ignore_missing_imports = true

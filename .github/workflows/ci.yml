name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Install exact locked dependencies
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - name: Check formatting and lint
        run: uv run --python ${{ matrix.python-version }} ruff check .
      - name: Check types
        run: uv run --python ${{ matrix.python-version }} mypy src/astra
      - name: Run tests with coverage
        run: uv run --python ${{ matrix.python-version }} pytest --cov=astra --cov-report=term-missing --cov-fail-under=90

  postgres-integration:
    name: PostgreSQL / migrations and concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: astra_test
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ASTRA_DATABASE_URL: postgresql+psycopg://astra:astra_test_only@localhost:5432/astra_test
      ASTRA_RUN_POSTGRES_INTEGRATION: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Install exact locked dependencies
        run: uv sync --locked --all-extras --python 3.13
      - name: Apply migration to clean PostgreSQL database
        run: uv run --python 3.13 alembic upgrade head
      - name: Verify PostgreSQL persistence and optimistic concurrency
        run: uv run --python 3.13 pytest tests/integration/test_postgres_missions.py -q
